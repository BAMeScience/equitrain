name: Installing and Testing
on: [push, pull_request]

# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
# `contents` is for permission to the contents of the repository.
# `pull-requests` is for permission to pull request
permissions:
  contents: write
  checks: write
  pull-requests: write

env:
  UV_SYSTEM_PYTHON: true

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        uv pip install -e '.[dev]'
    # - name: mypy
    #   run: |
    #     python -m mypy --ignore-missing-imports --follow-imports=silent --no-strict-optional equitrain tests
    - name: Test with pytest
      run: |
        python -m pytest -sv tests

  equiload-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: lutfia95/RTorch
        # Pin the native ABI dependency. Update this only after the referenced
        # EquiLoad commit has been merged/released and pushed to GitHub.
        ref: 2beef89beafa485314fc6ec92333682125b975ec
        path: equiload
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libhdf5-dev
    - name: Build EquiLoad against Equitrain's Torch
      run: |
        python -m venv .venv
        . .venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install -e '.[dev,torch]'
        bash equiload/scripts/install-python.sh --venv "$GITHUB_WORKSPACE/.venv"
    - name: Test the optional EquiLoad integration
      run: |
        . .venv/bin/activate
        python -m pytest -q tests/test_equiload_loader.py
  build-and-install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: Build the package
      run: |
        uv pip install build
        python -m build --sdist
    - name: Install the package
      run: |
        uv pip install dist/*.tar.gz
  ruff-linting:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: astral-sh/ruff-action@v3
          with:
            version: "0.15.11"
            args: "check"
            src: "."
  ruff-formatting:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: astral-sh/ruff-action@v3
          with:
            version: "0.15.11"
            args: "format --check --verbose"
            src: "."
